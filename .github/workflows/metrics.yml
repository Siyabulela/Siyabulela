name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Siyabulela
          template: classic
          config_timezone: Africa/Johannesburg

          # Totals only: no repository, community or language sections
          base: header, activity
          base_indepth: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
